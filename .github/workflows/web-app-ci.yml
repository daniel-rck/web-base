name: Web App CI

on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        default: "1.3.11"
        description: "Bun version to install"
      run-tests:
        type: boolean
        default: true
        description: "Whether to run vitest"
      run-build:
        type: boolean
        default: true
        description: "Whether to run the build step"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        if: ${{ inputs.run-tests }}
        run: bun run test

      - name: Build
        if: ${{ inputs.run-build }}
        run: bun run build
