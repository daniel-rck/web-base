name: Web App CI

# Reusable workflow: every app's CI calls this for lint, typecheck, test and
# build. It runs in nine app repos, so every action is pinned by commit SHA
# (Dependabot keeps the pins fresh) and the job only gets `contents: read`.
# Inputs and the caller pattern: docs/specs/06-workflows.md.

on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        default: ""
        description: >-
          Bun version to install. Empty (the default) lets setup-bun read the
          app's package.json `packageManager` ("bun@x.y.z").
      run-tests:
        type: boolean
        default: true
        description: "Whether to run vitest"
      run-build:
        type: boolean
        default: true
        description: "Whether to run the build step"

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Job-level and prefixed: a workflow-level group in a called workflow is
    # evaluated in the caller's context and can collide with the caller's own.
    concurrency:
      group: web-app-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Bun version source
        if: inputs.bun-version == ''
        run: |
          if ! jq -e '(.packageManager // "" | startswith("bun@")) or ((.engines.bun // "") != "")' package.json >/dev/null; then
            echo "::warning file=package.json::No \"packageManager\": \"bun@x.y.z\" in package.json and no bun-version input, so setup-bun installs the latest Bun. Pin it in package.json."
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      # setup-bun caches only the Bun binary, not the package cache.
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint + oxfmt)
        run: bun run lint

      # The conventional build script is `tsc -b && vite build`, which already
      # typechecks. Skip the separate typecheck then; keep it when the build
      # is off or runs without tsc (HamsterFlight: plain `vite build`).
      - name: Decide on a separate typecheck
        id: typecheck
        env:
          RUN_BUILD: ${{ inputs.run-build }}
        run: |
          build_script=$(jq -r '.scripts.build // ""' package.json)
          if [ "$RUN_BUILD" = "true" ] && grep -qw 'tsc' <<<"$build_script"; then
            echo "The build script runs tsc, so the build step typechecks."
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.typecheck.outputs.run == 'true'
        run: bun run typecheck

      - name: Test
        if: inputs.run-tests
        run: bun run test

      - name: Build
        if: inputs.run-build
        run: bun run build
