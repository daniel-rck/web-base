name: Notify apps

# Opens an "update available" issue in each consuming app repo when a web-base
# release is published. Updates stay manual: the issue is the reminder to run
# `web-base update`. Writing to the app repos needs the APP_NOTIFY_TOKEN secret
# (Issues read/write + Metadata read on the app repos; no access to app code).
# Without it every matrix job is a no-op. See docs/specs/06-workflows.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to announce (default: latest release tag)"
        required: false
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # the app repos are written with APP_NOTIFY_TOKEN only
    concurrency:
      group: notify-apps-${{ matrix.repo }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        repo:
          - daniel-rck/ErinnerMich
          - daniel-rck/HamsterFlight
          - daniel-rck/Hausverwaltung
          - daniel-rck/Minispiele
          - daniel-rck/Pizzateig
          - daniel-rck/Tankzettel
          - daniel-rck/Tennisturnier
          - daniel-rck/Tonspur
          - daniel-rck/Zeiterfassung
    steps:
      - name: Open update-available issue
        env:
          GH_TOKEN: ${{ secrets.APP_NOTIFY_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "APP_NOTIFY_TOKEN not set — skipping notification for $TARGET."
            exit 0
          fi
          if ! [[ "${VERSION:-}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No valid version resolved (run from a release or pass the version input)."
            exit 1
          fi
          title="web-base ${VERSION} verfügbar"
          # Avoid duplicates: skip if an open issue with this title already exists.
          existing=$(gh issue list --repo "$TARGET" --state open --search "in:title \"$title\"" --json title --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Issue already open in $TARGET — skipping."
            exit 0
          fi
          body=$(cat <<'EOF'
          Eine neue web-base-Version ist veröffentlicht.

          Diese App auf den neuen Stand bringen:

          ```
          bunx github:daniel-rck/web-base update core --apply
          ```

          Nur **owned**-Bausteine werden aktualisiert; **scaffold**-Nähte
          (theme.css-Akzent, db.ts-Schema, routes, Worker-Handler) bleiben
          unangetastet. Mit `bunx github:daniel-rck/web-base check` prüfst du
          vorab, ob owned-Bausteine lokal abgewichen sind.

          Changelog: https://github.com/daniel-rck/web-base/blob/main/CHANGELOG.md
          EOF
          )
          gh issue create --repo "$TARGET" --title "$title" --body "$body"
