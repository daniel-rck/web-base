name: Tools CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Includes the e2e suite (cli/src/e2e), which rebuilds cli/dist and runs
      # the bundle against scratch apps: add, check, update, --force, exit codes.
      - run: bun run test
      - run: bun run build

      - name: Verify committed cli/dist matches a fresh build
        run: |
          # cli/dist/index.js is committed because `bunx github:...` installs
          # the repo tarball as-is — Bun runs no prepare script for Git deps,
          # so the bin entry must already exist in the tree. Fail if the
          # committed bundle drifted from cli/src/ (fix: bun run build, commit).
          # `git status` rather than `git diff`: an extra emitted chunk is untracked.
          out=$(git status --porcelain -- cli/dist)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::cli/dist is stale — run bun run build and commit it"
            exit 1
          fi

      - name: Smoke test - scaffold core and lint
        run: |
          # Scaffold a full app from the templates and lint the result with the
          # shipped oxlint/oxfmt configs. The repo's own `bun run lint` skips
          # cli/templates, so this is the only guard that a freshly scaffolded app
          # is lint-clean (a11y and hooks rules pass, imports sorted, formatted).
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          git init -q && touch .gitignore   # oxfmt reads .gitignore
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add core
          bunx oxlint@1.85.0
          bunx oxfmt@0.70.0 --check
