name: Tools CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Verify committed cli/dist matches a fresh build
        run: |
          # cli/dist/index.js is committed because `bunx github:...` installs
          # the repo tarball as-is — Bun runs no prepare script for Git deps,
          # so the bin entry must already exist in the tree. Fail if the
          # committed bundle drifted from cli/src/ (fix: bun run build, commit).
          git diff --exit-code -- cli/dist

      - name: Verify CLI runs
        run: |
          chmod +x cli/dist/index.js
          node cli/dist/index.js --help
          node cli/dist/index.js add --help

      - name: Smoke test - add hygiene
        run: |
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add hygiene
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .editorconfig

      - name: Smoke test - scaffold core and lint
        run: |
          # Scaffold a full app from the templates and lint the result with the
          # shipped biome.json. The repo's own `bun run lint` skips cli/templates,
          # so this is the only guard that a freshly scaffolded app is lint-clean
          # (Tailwind directives parse, a11y rules pass, imports organized).
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          git init -q && touch .gitignore   # biome.json uses vcs.useIgnoreFile
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add core
          bunx --bun @biomejs/biome@2.5.11 check .

      - name: Smoke test - check passes on a fresh scaffold
        run: |
          # `check` is the drift guard nine app CIs call. If it can't come back
          # clean against templates it just installed itself, it is worthless.
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          git init -q && touch .gitignore
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add core
          node ${{ github.workspace }}/cli/dist/index.js check core
          node ${{ github.workspace }}/cli/dist/index.js check core --strict

      - name: Regression - update core is not a no-op
        run: |
          # `update` used to load a single manifest without expanding `extends`,
          # so `update core --apply` — the command notify-apps.yml sends to every
          # app — silently did nothing.
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          git init -q && touch .gitignore
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add core
          rm src/lib/ui/primitives.tsx
          node ${{ github.workspace }}/cli/dist/index.js update core --apply
          test -f src/lib/ui/primitives.tsx

      - name: Regression - --force must not clobber a scaffold seam
        run: |
          # wrangler.toml is a scaffold seam holding live Cloudflare R2/KV
          # binding IDs. A --force that replaced it with the template's
          # placeholders would take production sync down on the next deploy.
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          cd "$SCRATCH"
          git init -q && touch .gitignore
          echo '{"name":"scratch","version":"0.0.0"}' > package.json
          node ${{ github.workspace }}/cli/dist/index.js add core
          echo 'id = "PRODUCTION-KV-ID"' >> wrangler.toml
          node ${{ github.workspace }}/cli/dist/index.js add core --force
          grep -q 'PRODUCTION-KV-ID' wrangler.toml

      - name: Verify skill/template alignment
        run: |
          # Every cli/templates/<name>/ (except 'core') should have a matching
          # skill/references/<name>.md (with -system suffix allowed for layout).
          set -e
          fail=0
          for dir in cli/templates/*/; do
            name=$(basename "$dir")
            [ "$name" = "core" ] && continue
            ref="skill/references/${name}.md"
            alt="skill/references/${name}-system.md"
            if [ ! -f "$ref" ] && [ ! -f "$alt" ]; then
              echo "MISSING: $ref or $alt for template $name"
              fail=1
            fi
          done
          exit $fail
