name: Tools CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bun-version: setup-bun reads package.json `packageManager`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Includes the e2e suite (cli/src/e2e), which rebuilds cli/dist and runs
      # the bundle against scratch apps: add, check, update, --force, exit codes.
      - run: bun run test
      - run: bun run build

      - name: Verify committed cli/dist matches a fresh build
        run: |
          # cli/dist/index.js is committed because `bunx github:...` installs
          # the repo tarball as-is — Bun runs no prepare script for Git deps,
          # so the bin entry must already exist in the tree. Fail if the
          # committed bundle drifted from cli/src/ (fix: bun run build, commit).
          # `git status` rather than `git diff`: an extra emitted chunk is untracked.
          out=$(git status --porcelain -- cli/dist)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::cli/dist is stale — run bun run build and commit it"
            exit 1
          fi

  bunx-install:
    # The distribution path itself: what an app's CI runs. Catches a bundle
    # that builds but can't be installed from Git (the 0.2.1 failure).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: bunx github:<repo>#<sha> --version
        env:
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected=$(jq -r .version package.json)
          cd "$RUNNER_TEMP"
          actual=$(bunx "github:$REPO#$SHA" --version)
          echo "bunx github:$REPO#$SHA --version → $actual"
          test "$actual" = "$expected"

  scaffold:
    # A new app from `init`, plus the extras, must install, lint, typecheck,
    # test and build — the only place the React templates are typechecked and
    # their tests (cli/template-tests) run. Resolves the newest caret versions,
    # so an upstream release can break it; that is the point.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Where the app goes
        run: echo "APP=$RUNNER_TEMP/scratch-app" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Scaffold with init, add the extras and the template tests
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/cli/dist/index.js"
          node "$cli" init --cwd "$APP" --name scratch-app
          node "$cli" add backup --cwd "$APP"
          node "$cli" add sync --cwd "$APP"
          mkdir -p "$APP/src/__base_tests__"
          cp -R cli/template-tests/. "$APP/src/__base_tests__/"
          rm "$APP/src/__base_tests__/README.md"

      - name: Install
        working-directory: ${{ env.APP }}
        run: bun install

      - name: Lint (the shipped oxlint + oxfmt configs)
        working-directory: ${{ env.APP }}
        run: bun run lint

      - name: Typecheck (app, node, service worker, worker)
        working-directory: ${{ env.APP }}
        run: bun run typecheck

      - name: Test (template tests under the testing template's setup)
        working-directory: ${{ env.APP }}
        run: bun run test

      - name: Build
        working-directory: ${{ env.APP }}
        run: bun run build

      - name: The base's own guards are clean on the scaffold
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/cli/dist/index.js"
          node "$cli" check app --strict
          node "$cli" check backup --strict
          node "$cli" check sync --strict
          node "$cli" pins

      - name: The worker bundles (wrangler dry run)
        working-directory: ${{ env.APP }}
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (with shellcheck on every run script)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/actionlint.tgz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor (offline audits)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format github .github/workflows
